[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stellar-cluster-finder"
version = "0.1.0"
description = "Code for the 2026 PPT at RWTH Aachen University"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Fabian Polnitzky", email = "fabian.polnitzky@rwth-aachen.de" }
]
dependencies = [
    "astropy>=8.0.1",
    "fastparquet>=2026.5.0",
    "matplotlib>=3.11.1",
    "numpy==2.4.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "ruff>=0.16.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "ty>=0.0.73",
]

[project.urls]
"Homepage" = "https://github.com/fabianpolnitzky/stellar-cluster-finder"
